name: SEC Form 4 每日擷取

# 台北 06:00（UTC 前一日 22:00）。對應美股週一至週五的申報，所以排在台北週二至週六。
# 擷取成功後提交成果並同步到 institutional_insider/。需要 Secret：SEC_IDENTITY（未設定時略過，不算失敗）。
on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

# 與每日負面新聞、離線覆核共用，避免同時寫入
concurrency:
  group: unified-risk-news-main
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ready: ${{ steps.identity.outputs.ready }}
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check SEC identity
        id: identity
        env:
          SEC_IDENTITY: ${{ secrets.SEC_IDENTITY }}
        run: |
          if [ -z "$SEC_IDENTITY" ]; then
            echo "::warning::尚未設定 SEC_IDENTITY secret（名稱＋聯絡信箱），略過 SEC 擷取"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.identity.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.identity.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sec_filings/requirements.txt
      - name: Install pinned SEC dependencies
        if: steps.identity.outputs.ready == 'true'
        run: pip install -r sec_filings/requirements.txt
      - uses: actions/cache@v4
        if: steps.identity.outputs.ready == 'true'
        with:
          path: ../sec-cache
          key: sec-edgar-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sec-edgar-${{ runner.os }}-
      - name: Verify runners
        if: steps.identity.outputs.ready == 'true'
        run: python -m unittest tests.test_form4_runner tests.test_run_13f -v
      - name: Fetch Form 4 (13F is not executed)
        if: steps.identity.outputs.ready == 'true'
        env:
          SEC_IDENTITY: ${{ secrets.SEC_IDENTITY }}
        run: python -u sec_filings/run_form4.py
      - name: Publish result (keep latest 30 daily folders)
        if: steps.identity.outputs.ready == 'true'
        run: |
          ls -d sec_filings/insider_form4/*/ | sort | head -n -30 | xargs -r rm -rf
          git config user.name 'RMSecfb'
          git config user.email '313385187+RMSecfb@users.noreply.github.com'
          git add -A -- sec_filings/insider_form4
          if git diff --cached --quiet; then echo "沒有新成果"; exit 0; fi
          git commit -m 'Form 4 每日成果'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

  sync:
    needs: fetch
    if: needs.fetch.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pandas>=2.2,<3' openpyxl requests
      - run: python -m unittest discover -s tests -p test_participants.py -v
      - name: Sync validated results to institutional_insider/
        run: python -m pipeline.participants
