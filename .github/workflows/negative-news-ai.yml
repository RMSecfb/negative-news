name: US Risk News AI (free-tier POC)

on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        description: 'Market events (independent of legacy SP500 app) or hybrid scan'
        options: [market, hybrid]
        default: market
      max_tickers:
        description: 'SP500 names per run (0 means full list; start with 60)'
        required: false
        default: '60'
      max_llm:
        description: 'Maximum LLM API calls (start with 35)'
        required: false
        default: '35'
      run_date:
        description: 'Optional YYYY-MM-DD for backfill; use with no_fetch=true'
        required: false
        default: ''
      no_fetch:
        type: boolean
        description: 'Only reclassify existing data (no RSS fetch)'
        default: false
  schedule:
    - cron: '20 0 * * *' # 08:20 Asia/Taipei; UTC, may be delayed

permissions:
  contents: write
concurrency:
  group: ai-risk-news-main
  cancel-in-progress: false

jobs:
  daily-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ai.txt
      - name: Install minimal batch dependencies
        run: pip install -r requirements-ai.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate LLM configuration
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAX_LLM_CALLS: ${{ inputs.max_llm || '35' }}
        run: |
          if [[ "$MAX_LLM_CALLS" != "0" && -z "$GROQ_API_KEY" ]]; then
            echo '::error::Set the GROQ_API_KEY repository Actions secret before enabling LLM analysis.'
            exit 1
          fi
      - name: Run independent RSS crawler and LLM
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAX_TICKERS: ${{ inputs.max_tickers || '60' }}
          MAX_LLM_CALLS: ${{ inputs.max_llm || '35' }}
          NO_FETCH: ${{ inputs.no_fetch || 'false' }}
          SCAN_SCOPE: ${{ inputs.scope || 'market' }}
          RUN_DATE: ${{ inputs.run_date || '' }}
        shell: bash
        run: |
          extra=()
          if [[ "$NO_FETCH" == "true" ]]; then extra+=(--no-fetch); fi
          if [[ -n "$RUN_DATE" ]]; then extra+=(--date "$RUN_DATE"); fi
          python -m pipeline.run --scope "$SCAN_SCOPE" --max-tickers "$MAX_TICKERS" --max-llm "$MAX_LLM_CALLS" "${extra[@]}"
      - name: Commit daily CSV and run report (not legacy snapshot)
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_news_daily/ ai_news_raw/
          if git diff --cached --quiet; then echo 'Nothing changed'; exit 0; fi
          git commit -m "AI risk news daily result"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo 'Could not push after retries'; exit 1
