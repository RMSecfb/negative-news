name: Unified Risk News · FinBERT + LLM

on:
  workflow_dispatch:
    inputs:
      max_llm:
        description: 'Maximum NEW LLM requests this run (cached/manual results are reused)'
        required: false
        default: '35'
      resume:
        type: boolean
        description: 'Only analyze existing last-48h news; do not crawl again'
        default: false
      repair_tickers:
        type: boolean
        description: 'Audit/backfill tickers across ALL stored news dates; zero LLM calls'
        default: false
      as_schedule:
        type: boolean
        description: '外部定時觸發用：以每日排程身分執行（記為 daily-日期），之後晚到的 GitHub 排程會略過'
        default: false
  push:
    paths:
      - 'news_requests/*.json'
  schedule:
    - cron: '20 0 * * *' # 08:20 Asia/Taipei; previous 08:20 to current 08:20

permissions:
  contents: write

concurrency:
  group: unified-risk-news-main
  cancel-in-progress: false

jobs:
  unified-news:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PYTHONUNBUFFERED: '1'
      LLM_DAILY_MAX: '120'
      # 每日排程（含 Cloudflare 以 as_schedule 觸發）的判讀筆數；手動執行仍用 max_llm（預設 35）。
      # gpt-oss-20b 免費方案每日約 20 萬 token、每次約 1,600 token，總量約 125 次，保留 20 次給手動執行。
      DAILY_MAX_LLM: '100'
      GROQ_MIN_INTERVAL_SECONDS: '20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install original crawler and CPU FinBERT dependencies
        run: |
          pip install --timeout 180 torch --index-url https://download.pytorch.org/whl/cpu
          pip install --timeout 180 -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-prosus-cpu-v1
      - uses: actions/cache@v4
        with:
          path: 負面新聞整合資料/system.db
          key: news-score-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: news-score-db-${{ runner.os }}-
      - name: Run regression and integration tests
        run: python -m unittest discover -s tests -v
      - name: Refresh verified US issuer directory
        run: python -m pipeline.symbols
      - name: Run unified schedule or drain queued manual requests
        env:
          MAX_LLM: ${{ inputs.max_llm || '35' }}
          RESUME: ${{ inputs.resume || 'false' }}
          REPAIR_TICKERS: ${{ inputs.repair_tickers || 'false' }}
          RUN_EVENT: ${{ inputs.as_schedule && 'schedule' || github.event_name }}
        shell: bash
        run: |
          extra=()
          if [[ "$REPAIR_TICKERS" == "true" ]]; then
            python -m pipeline.ticker_audit
            exit 0
          fi
          if [[ "$RESUME" == "true" ]]; then extra+=(--resume); fi
          if [[ "$RUN_EVENT" == "schedule" && "$RESUME" != "true" ]]; then MAX_LLM="$DAILY_MAX_LLM"; fi
          echo "LLM 本次上限：$MAX_LLM（每日總上限 $LLM_DAILY_MAX）"
          python -m pipeline.integrated --event "$RUN_EVENT" --max-llm "$MAX_LLM" "${extra[@]}"
